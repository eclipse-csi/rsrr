[project]
name = "rsrr"
version = "0.1.0"
description = "Rapid Security Review Runner"
readme = "README.md"
authors = [
    { name = "Lukas Puehringer", email = "lukas.puehringer@eclipse-foundation.org" }
]
requires-python = ">=3.13.2"
dependencies = [
    "click>=8.3.1",
    "httpx>=0.28.1",
]

[project.scripts]
rsrr = "rsrr.cli:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
